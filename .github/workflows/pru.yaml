name: prudynt-t
on:
  workflow_dispatch:
  pull_request:
    branches:
      - '**'

env:
  TAG_NAME: release
  TOOLCHAIN_URL: https://github.com/themactep/thingino-firmware/releases/download/toolchain-x86_64/thingino-toolchain-x86_64_xburst1_4_4_musl_gcc14-linux-mipsel.tar.gz
  TOOLCHAIN_DIR: /opt/mipsel-thingino-linux-musl_sdk-buildroot
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  native-build:
    name: prudynt-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - T31
        build_type:
          - dynamic

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --no-install-suggests \
            build-essential bc bison cpio curl file flex git libncurses-dev \
            make rsync unzip wget whiptail gcc lzop u-boot-tools \
            ca-certificates cmake ccache

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: /opt/mipsel-thingino-linux-musl_sdk-buildroot
          key: toolchain-${{ env.TOOLCHAIN_URL }}

      - name: Download and extract toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p /opt
          cd /opt
          wget "$TOOLCHAIN_URL" -O thingino-toolchain.tar.gz
          tar -xf thingino-toolchain.tar.gz
          cd mipsel-thingino-linux-musl_sdk-buildroot
          ./relocate-sdk.sh

      - name: Relocate toolchain
        if: steps.cache-toolchain.outputs.cache-hit == 'true'
        run: |
          cd /opt/mipsel-thingino-linux-musl_sdk-buildroot
          ./relocate-sdk.sh

      - name: Set up toolchain and ccache env vars
        run: |
          echo "TOOLCHAIN_DIR=${TOOLCHAIN_DIR}" >> $GITHUB_ENV
          echo "PATH=/usr/lib/ccache:${TOOLCHAIN_DIR}/bin:$PATH" >> $GITHUB_ENV
          echo "CC=${TOOLCHAIN_DIR}/bin/mipsel-linux-gcc" >> $GITHUB_ENV
          echo "CXX=${TOOLCHAIN_DIR}/bin/mipsel-linux-g++" >> $GITHUB_ENV
          echo "PRUDYNT_CROSS=${TOOLCHAIN_DIR}/bin/mipsel-linux-" >> $GITHUB_ENV

      - name: Restore ccache
        id: restore-ccache
        if: always()
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.target }}-${{ matrix.build_type }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.target }}-${{ matrix.build_type }}-

      - name: Set build suffix
        id: suffix
        run: |
          case "${{ matrix.build_type }}" in
            static) echo "SUFFIX=-static" >> $GITHUB_ENV ;;
            hybrid) echo "SUFFIX=-hybrid" >> $GITHUB_ENV ;;
            *) echo "SUFFIX=" >> $GITHUB_ENV ;;
          esac

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            3rdparty/install
            3rdparty/libhelix-aac
            3rdparty/libwebsockets
            3rdparty/opus
            3rdparty/libschrift
            3rdparty/json-c
            3rdparty/live
            3rdparty/ingenic-lib
            3rdparty/ingenic-musl
            3rdparty/libaudioshim
            3rdparty/faac
          key: deps-${{ matrix.target }}-${{ matrix.build_type }}-${{ hashFiles('build.sh', 'scripts/**') }}
          restore-keys: |
            deps-${{ matrix.target }}-${{ matrix.build_type }}-
            deps-${{ matrix.target }}-

      - name: Build deps
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          ./build.sh deps ${{ matrix.target }} $SUFFIX

      - name: Build prudynt
        run: |
          ./build.sh prudynt ${{ matrix.target }} $SUFFIX
          mv bin/prudynt "bin/prudynt-${{ matrix.target }}-${{ matrix.build_type }}"

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: prudynt-${{ matrix.target }}-${{ matrix.build_type }}
          path: bin/prudynt-${{ matrix.target }}-${{ matrix.build_type }}

      - name: Upload binary to release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: |
            bin/prudynt-${{ matrix.target }}-${{ matrix.build_type }}
